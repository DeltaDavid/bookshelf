<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>David's Bookshelf</title>
<style>
:root{--bg:#1a1a2e;--bg2:#16213e;--bg3:#0f3460;--accent:#e94560;--txt:#eee;--dim:#888;--border:#333}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh}
a{color:var(--accent);text-decoration:none}
.hdr{background:linear-gradient(135deg,var(--bg2),var(--bg));padding:25px 40px;border-bottom:3px solid var(--accent)}
.hdr h1{font-size:2em;color:var(--accent);font-family:Georgia,serif}
.hdr .sub{color:var(--dim);font-size:.9em;margin-top:4px}
.tabs{background:var(--bg2);padding:0 40px;display:flex;gap:0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200}
.tab-btn{padding:14px 24px;background:none;border:none;color:var(--dim);font-size:15px;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;font-weight:500}
.tab-btn:hover{color:var(--txt);background:rgba(255,255,255,.03)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.ctl{background:var(--bg2);padding:12px 40px;display:flex;gap:15px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.ctl input[type=text]{padding:8px 16px;border-radius:20px;border:1px solid #555;background:var(--bg3);color:var(--txt);font-size:14px;width:280px;outline:none}
.ctl input:focus{border-color:var(--accent)}
.ctl select{padding:8px 12px;border-radius:10px;border:1px solid #555;background:var(--bg3);color:var(--txt);font-size:14px}
.ctl .st{margin-left:auto;color:var(--dim);font-size:13px}
.view{display:none;padding:20px 40px}.view.active{display:block}
.cs{margin-bottom:30px}
.ch{font-size:1.15em;color:var(--accent);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:10px;font-family:Georgia,serif}
.ch .cn{font-size:.55em;color:var(--dim);font-weight:normal}</style></head><body>
<div class="hdr"><h1>David's Bookshelf</h1>
<div class="sub"><span id="bookcount">0</span> books read across <span id="catcount">0</span> categories</div></div>
<div class="tabs">
<button class="tab-btn active" onclick="switchTab('spine')">Spine</button><button class="tab-btn" onclick="switchTab('cover')">Cover</button>
<button class="tab-btn" onclick="switchTab('table')">Table</button>
<button class="tab-btn" onclick="switchTab('stats')">Stats</button>
</div>
<div class="ctl">
<input type="text" id="srch" placeholder="Search titles, authors...">
<select id="cf"><option value="">All Categories</option></select>
<div class="st" id="st">0 books</div>
</div>
<div class="view active" id="v-spine"></div>
<div class="view" id="v-cover"></div>
<div class="view" id="v-table"></div>
<div class="view" id="v-stats"></div>

<!-- Book Detail Modal -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
<div class="modal">
<button class="modal-close" onclick="closeModal()">&times;</button>
<div class="modal-top">
<div id="modal-cover"></div>
<div class="modal-info">
<h2 id="modal-title"></h2>
<div class="mi-author" id="modal-author"></div>

<div class="mi-avg-rate"><span id="modal-avg-stars"></span> <span class="mi-avg" id="modal-avg-text"></span></div>
<div class="mi-meta" id="modal-meta"></div>
</div>
</div>
<div class="modal-body" id="modal-body"></div>
</div>
</div><style>
/* SPINE VIEW */
.shelf-row{display:flex;align-items:flex-end;gap:5px;padding:10px 5px 0;min-height:200px;flex-wrap:wrap}
.shelf-wood{height:14px;background:linear-gradient(180deg,#a0764a,#8B5E3C 30%,#6B3F23 60%,#5a3520);border-radius:0 0 4px 4px;box-shadow:0 6px 12px rgba(0,0,0,.4);position:relative}
.shelf-wood::before{content:'';position:absolute;top:-3px;left:0;right:0;height:3px;background:linear-gradient(180deg,rgba(255,255,255,.15),transparent)}
.book3d{position:relative;transform-style:preserve-3d;transition:transform .5s ease,margin .3s;cursor:pointer;z-index:1;flex-shrink:0;perspective:800px}
.book3d:hover{transform:rotateY(-35deg) rotateX(3deg) translateZ(25px) translateY(-12px);z-index:50;margin:0 18px}
.spine{display:flex;flex-direction:column;justify-content:center;align-items:center;border-radius:2px 0 0 2px;box-shadow:1px 2px 8px rgba(0,0,0,.4);writing-mode:vertical-rl;text-orientation:mixed;padding:2px 1px;overflow:hidden;position:relative}
.spine .sp-t{font-size:8px;font-weight:bold;letter-spacing:.3px;line-height:1;display:block;max-height:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spine .sp-a{font-size:6.5px;opacity:.7;margin-top:2px;display:block;max-height:20%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spine::after{content:'';position:absolute;top:0;right:0;bottom:0;width:2px;background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(0,0,0,.1))}
.cover-face{position:absolute;top:0;left:100%;width:120px;height:100%;transform:rotateY(90deg);transform-origin:left center;border-radius:0 2px 2px 0;overflow:hidden;box-shadow:3px 3px 10px rgba(0,0,0,.5)}
.cover-face img{width:100%;height:100%;object-fit:cover}
.book-top{position:absolute;top:0;left:0;width:100%;height:0;transform:rotateX(90deg);transform-origin:top center;background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.02));pointer-events:none}
.book-bottom{position:absolute;bottom:0;left:0;width:100%;height:0;transform:rotateX(-90deg);transform-origin:bottom center;background:linear-gradient(90deg,rgba(0,0,0,.15),rgba(0,0,0,.05));pointer-events:none}

/* COVER VIEW */
.cover-grid{display:flex;flex-wrap:wrap;gap:18px;padding:12px 0}
.cover-item{position:relative;cursor:pointer;transition:transform .2s}
.cover-item:hover{transform:translateY(-8px) scale(1.05);z-index:10}
.cover-item img{width:105px;height:158px;border-radius:3px;box-shadow:2px 4px 12px rgba(0,0,0,.5);object-fit:contain;background:var(--bg2)}
.cover-ph{width:105px;height:158px;border-radius:3px;box-shadow:2px 4px 12px rgba(0,0,0,.5);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px;text-align:center;font-size:9px}

/* TABLE VIEW */
.tbl-wrap{overflow-x:auto}
table.bk-tbl{width:100%;border-collapse:collapse;font-size:13px}
.bk-tbl th{padding:10px 8px;text-align:left;background:var(--bg2);color:var(--accent);border-bottom:2px solid var(--accent);border-right:1px solid var(--border);cursor:pointer;position:sticky;top:0;z-index:10;user-select:none;white-space:nowrap;overflow:hidden;resize:horizontal}
.bk-tbl th.no-sort{cursor:default;resize:none}
.bk-tbl th:last-child{border-right:none}
.bk-tbl th:hover{background:var(--bg3)}
.bk-tbl th .arrow{margin-left:4px;font-size:10px;opacity:.5}
.bk-tbl th.sorted .arrow{opacity:1}
.bk-tbl td{padding:7px 8px;border-bottom:1px solid #222;border-right:1px solid rgba(51,51,51,.5);vertical-align:middle;overflow:hidden;text-overflow:ellipsis}
.bk-tbl tr{cursor:pointer}.bk-tbl tr:hover{background:var(--bg2)}
.bk-tbl .tbl-cover{width:32px;height:48px;object-fit:cover;border-radius:2px}
.cat-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;white-space:nowrap}
/* HALF-STAR RATING */
.hstar{display:inline-flex;align-items:center;cursor:pointer;font-size:18px;position:relative}
.hstar .star{position:relative;display:inline-block;width:.6em;height:1em;overflow:hidden;color:#444}
.hstar .star.left{margin-left:2px}
.hstar .star.right{width:.6em}
.hstar .star::before{content:'\2605';position:absolute}
.hstar .star.left::before{left:0}
.hstar .star.right::before{right:0;left:-.6em}
.hstar .star.on{color:var(--accent)}
.hstar .star:hover{color:var(--accent);opacity:.8}
.hstar-ro{color:var(--accent);letter-spacing:1px;font-size:13px}
.hstar-val{font-size:11px;color:var(--dim);margin-left:4px}

/* EDITABLE FIELDS */
.editable{cursor:pointer;border-bottom:1px dashed rgba(255,255,255,.2);padding:4px 6px;border-radius:2px;display:block;min-height:1.4em;min-width:60px}
.editable:hover{background:rgba(233,69,96,.15);border-bottom-color:var(--accent)}
.edit-input{background:var(--bg3);color:var(--txt);border:1px solid var(--accent);border-radius:4px;padding:4px 6px;font-size:inherit;font-family:inherit;outline:none;width:100%;min-width:90px}
.edit-input:focus{box-shadow:0 0 0 2px rgba(233,69,96,.3)}
.edit-input[type=date]{min-width:130px}
/* SHELF PICKER */
.shelf-picker{position:absolute;z-index:300;background:var(--bg2);border:1px solid var(--accent);border-radius:8px;padding:8px;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.shelf-picker label{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:13px;color:var(--txt)}
.shelf-picker label:hover{background:rgba(233,69,96,.1)}
.shelf-picker .sp-name{flex:1}
.shelf-picker .sp-del{color:var(--dim);font-size:16px;padding:0 4px;cursor:pointer;opacity:0;transition:opacity .2s}
.shelf-picker label:hover .sp-del{opacity:1}
.shelf-picker .sp-del:hover{color:var(--accent)}
.shelf-picker input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.shelf-picker .sp-add{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.shelf-picker .sp-add input{flex:1;padding:4px 8px;border-radius:4px;border:1px solid #555;background:var(--bg3);color:var(--txt);font-size:12px;outline:none}
.shelf-picker .sp-add button{padding:4px 10px;border-radius:4px;border:none;background:var(--accent);color:#fff;font-size:12px;cursor:pointer}
.shelf-picker .sp-done{display:block;width:100%;margin-top:8px;padding:6px;border-radius:4px;border:none;background:var(--bg3);color:var(--accent);font-size:13px;cursor:pointer;font-weight:bold}
.shelf-picker .sp-done:hover{background:var(--accent);color:#fff}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:20px;margin-top:15px}
.stat-card{background:var(--bg2);border-radius:12px;padding:20px;border:1px solid var(--border)}
.stat-card h3{color:var(--accent);font-size:1em;margin-bottom:12px;font-family:Georgia,serif}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar-label{width:180px;font-size:12px;text-align:right;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:20px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:6px;font-size:10px;color:#fff;font-weight:bold;min-width:20px}
.big-num{font-size:2.5em;color:var(--accent);font-weight:bold;font-family:Georgia,serif}
.big-label{font-size:.85em;color:var(--dim);margin-top:2px}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;text-align:center}

/* TOOLTIP */
.tip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--accent);border-radius:8px;padding:10px;width:220px;z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,.6);pointer-events:none;writing-mode:horizontal-tb}
.book3d:hover .tip,.cover-item:hover .tip{display:block}
.tip .t1{font-size:12px;font-weight:bold;color:#fff;margin-bottom:3px}
.tip .t2{font-size:10px;color:#ccc;margin-bottom:4px}
.tip .t3{font-size:11px;color:var(--accent)}.tip .t4{font-size:9px;color:var(--dim);margin-top:3px}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;justify-content:center;align-items:flex-start;padding:40px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:16px;max-width:700px;width:100%;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--dim);font-size:24px;cursor:pointer;z-index:10}
.modal-close:hover{color:var(--accent)}
.modal-top{display:flex;gap:24px;padding:30px;background:var(--bg2);border-radius:16px 16px 0 0}
.modal-cover{width:150px;height:225px;border-radius:6px;box-shadow:4px 6px 20px rgba(0,0,0,.5);object-fit:cover;flex-shrink:0}
.modal-cover-ph{width:150px;height:225px;border-radius:6px;box-shadow:4px 6px 20px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;text-align:center;padding:15px;font-size:14px}
.modal-info{flex:1}.modal-info h2{font-size:1.4em;color:var(--txt);font-family:Georgia,serif;margin-bottom:4px;cursor:pointer}
.modal-info h2:hover{color:var(--accent);text-decoration:underline}
.mi-author{font-size:1em;color:var(--dim);margin-bottom:12px;cursor:pointer}
.mi-author:hover{color:var(--accent);text-decoration:underline}
.mi-label{font-size:.8em;color:var(--dim);margin-right:6px}
.mi-my-rate,.mi-avg-rate{margin-bottom:8px;display:flex;align-items:center;gap:8px}
.mi-avg{font-size:.85em;color:var(--dim)}
.mi-meta{font-size:.85em;color:var(--dim);line-height:1.8}
.modal-body{padding:24px 30px}
.mb-section{margin-bottom:14px}
.mb-label{font-size:.75em;text-transform:uppercase;color:var(--accent);letter-spacing:1px;margin-bottom:4px}
.mb-val{font-size:.9em;color:var(--txt)}
.mb-shelves span{display:inline-block;padding:3px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;font-size:.8em;margin:2px 4px 2px 0}
@media(max-width:768px){.view{padding:10px 15px}.hdr{padding:15px}.tabs{padding:0 10px}
.tab-btn{padding:10px 14px;font-size:13px}.modal-top{flex-direction:column;align-items:center}.stats-grid{grid-template-columns:1fr}}
</style><script>
const CC={"Art & Design":"#9C27B0","Business & Entrepreneurship":"#1565C0","Computing & Programming":"#2E7D32","Cooking & Food":"#E65100","Data & Software Engineering":"#00695C","Economics":"#AD1457","Finance & Investing":"#283593","Health & Wellness":"#558B2F","History & Politics":"#BF360C","Home Improvement & DIY":"#4E342E","Humor & Trivia":"#F57F17","Judaism & Jewish Life":"#006064","Law & Legal":"#4A148C","Literature & Fiction":"#827717","Music & Entertainment":"#880E4F","Outdoors & Sports":"#1B5E20","Parenting & Family":"#BF360C","Philosophy":"#4527A0","Psychology & Relationships":"#01579B","Reference & General Knowledge":"#37474F","Sales & Marketing":"#0D47A1","Science & Nature":"#1B5E20","Science Fiction & Fantasy":"#311B92","Self-Help & Personal Growth":"#FF6F00","Shakespeare":"#6A1B9A","Spirituality & Religion":"#004D40","Survival & Preparedness":"#3E2723","Travel":"#0277BD","Writing & Language":"#D84315","Uncategorized":"#616161"};
const CB={"Art & Design":"#F3E5F5","Business & Entrepreneurship":"#E3F2FD","Computing & Programming":"#E8F5E9","Cooking & Food":"#FFF3E0","Data & Software Engineering":"#E0F2F1","Economics":"#FCE4EC","Finance & Investing":"#E8EAF6","Health & Wellness":"#F1F8E9","History & Politics":"#FBE9E7","Home Improvement & DIY":"#EFEBE9","Humor & Trivia":"#FFF9C4","Judaism & Jewish Life":"#E0F7FA","Law & Legal":"#F3E5F5","Literature & Fiction":"#FFFDE7","Music & Entertainment":"#FCE4EC","Outdoors & Sports":"#E8F5E9","Parenting & Family":"#FFF3E0","Philosophy":"#EDE7F6","Psychology & Relationships":"#E1F5FE","Reference & General Knowledge":"#ECEFF1","Sales & Marketing":"#E3F2FD","Science & Nature":"#E8F5E9","Science Fiction & Fantasy":"#EDE7F6","Self-Help & Personal Growth":"#FFF8E1","Shakespeare":"#F3E5F5","Spirituality & Religion":"#E0F7FA","Survival & Preparedness":"#EFEBE9","Travel":"#E1F5FE","Writing & Language":"#FBE9E7","Uncategorized":"#F5F5F5"};

let DATA=[],BY_CAT={},CATS=[];
let saved=JSON.parse(localStorage.getItem('bs_data')||'{}');
let ALL_SHELVES=JSON.parse(localStorage.getItem('bs_shelves')||'[]');
// saved[id] = {rating: 3.5, shelves: "...", date_read: "..."}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function tc(hx){if(!hx)return'#fff';const r=parseInt(hx.slice(1,3),16),g=parseInt(hx.slice(3,5),16),b=parseInt(hx.slice(5,7),16);return(.299*r+.587*g+.114*b)/255<.5?'#fff':'#1a1a1a'}
function spH(p){return p?Math.max(180,Math.min(300,180+Math.floor(p/4))):200+Math.floor(Math.random()*40)}
function spW(p){return p?Math.max(36,Math.min(62,34+Math.floor(p/22))):38+Math.floor(Math.random()*10)}

// Get/set editable fields
function getR(b){const s=saved[b.id];return s&&s.rating!==undefined?s.rating:b.my_rating}
function getShelves(b){const s=saved[b.id];return s&&s.shelves!==undefined?s.shelves:b.shelves}
function getDateRead(b){const s=saved[b.id];return s&&s.date_read!==undefined?s.date_read:b.date_read}
function getNotes(b){const s=saved[b.id];return s&&s.notes!==undefined?s.notes:''}
function saveField(id,field,val){if(!saved[id])saved[id]={};saved[id][field]=val;localStorage.setItem('bs_data',JSON.stringify(saved))}

// US date format
function fmtDate(d){
  if(!d)return'';
  // Input: YYYY/MM/DD or YYYY-MM-DD or already MM/DD/YYYY
  const parts=d.replace(/-/g,'/').split('/');
  if(parts.length===3){
    if(parts[0].length===4)return parts[1]+'/'+parts[2]+'/'+parts[0]; // YYYY/MM/DD -> MM/DD/YYYY
    return d; // already US format
  }
  return d;
}
function toISO(d){
  if(!d)return'';
  const parts=d.replace(/-/g,'/').split('/');
  if(parts.length===3&&parts[2].length===4)return parts[2]+'/'+parts[0]+'/'+parts[1];
  return d;
}
// HALF-STAR widget: each full star is split into left (.5) and right (full) halves
function halfStarHTML(rating,bookId,editable){
  if(!editable){
    // Read-only display
    let h='<span class="hstar-ro">';
    for(let i=1;i<=5;i++){
      if(rating>=i)h+='\u2605';
      else if(rating>=i-0.5)h+='\u00BD'; // show half
      else h+='\u2606';
    }
    return h+'</span>';
  }
  // Editable widget
  let h='<span class="hstar" data-bid="'+bookId+'">';
  for(let i=1;i<=5;i++){
    const leftVal=i-0.5, rightVal=i;
    const leftOn=rating>=leftVal?'on':'';
    const rightOn=rating>=rightVal?'on':'';
    h+='<span class="star left '+leftOn+'" data-v="'+leftVal+'" onclick="clickStar(event,'+bookId+','+leftVal+')" onmouseenter="previewHalf(this,'+leftVal+')" onmouseleave="resetHalf(this,'+bookId+')"></span>';
    h+='<span class="star right '+rightOn+'" data-v="'+rightVal+'" onclick="clickStar(event,'+bookId+','+rightVal+')" onmouseenter="previewHalf(this,'+rightVal+')" onmouseleave="resetHalf(this,'+bookId+')"></span>';
  }
  h+='<span class="hstar-val">'+(rating?rating.toFixed(1):'—')+'</span></span>';
  return h;
}
function clickStar(e,bid,val){
  e.stopPropagation();
  saveField(bid,'rating',val);
  renderTable();
  // If modal is open for this book, refresh it
  if(document.getElementById('modal').classList.contains('open')&&currentModalId===bid)openModal(bid);
}
function previewHalf(el,val){
  const container=el.closest('.hstar');
  container.querySelectorAll('.star').forEach(s=>{
    const sv=parseFloat(s.dataset.v);
    s.classList.toggle('on',sv<=val);
  });
  container.querySelector('.hstar-val').textContent=val.toFixed(1);
}
function resetHalf(el,bid){
  const container=el.closest('.hstar');
  const r=getR(DATA.find(b=>b.id===bid));
  container.querySelectorAll('.star').forEach(s=>{
    const sv=parseFloat(s.dataset.v);
    s.classList.toggle('on',sv<=r);
  });
  container.querySelector('.hstar-val').textContent=r?r.toFixed(1):'—';
}

function starsRO(n){
  let h='';
  for(let i=1;i<=5;i++){
    if(n>=i)h+='\u2605';
    else if(n>=i-0.5)h+='\u2605';  // round up display for avg
    else h+='\u2606';
  }
  return h;
}
function amazonURL(b){return'https://www.amazon.com/s?k='+encodeURIComponent(b.title+' '+b.author)}
function wikiURL(author){return'https://en.wikipedia.org/wiki/'+encodeURIComponent(author.replace(/ /g,'_'))}
function coverHTML(b,w,h){
  if(b.cover)return'<img src="'+b.cover+'" width="'+w+'" height="'+h+'" loading="lazy" style="object-fit:contain;border-radius:3px">';
  const bg=CB[b.category]||'#F5F5F5',fg=CC[b.category]||'#616161';

function tipHTML(b){

// ===== INLINE EDITING =====
function makeEditable(val,bookId,field,className){
  let display;
  if(field==='date_read')display=val?fmtDate(val):'<span style="color:var(--dim);font-style:italic">click to edit</span>';
  else if(field==='notes')display=val?esc(val).replace(/\n/g,'<br>'):'<span style="color:var(--dim);font-style:italic">Add notes...</span>';
  else display=val?esc(val):'<span style="color:var(--dim);font-style:italic">click to edit</span>';
  return '<span class="editable '+(className||'')+'" onclick="event.stopPropagation();startEdit(this,'+bookId+',\''+field+'\')" title="Click to edit">'+display+'</span>';
}
function collectAllShelves(){
  const s=new Set(ALL_SHELVES);
  DATA.forEach(b=>{
    const sh=getShelves(b)||'';
    sh.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>s.add(x));
  });
  ALL_SHELVES=[...s].sort();
  localStorage.setItem('bs_shelves',JSON.stringify(ALL_SHELVES));
  return ALL_SHELVES;
}
function openShelfPicker(el,bookId){
  // Close any existing picker
  document.querySelectorAll('.shelf-picker').forEach(p=>p.remove());
  const b=DATA.find(x=>x.id===bookId);
  const current=(getShelves(b)||'').split(',').map(x=>x.trim()).filter(Boolean);
  const allSh=collectAllShelves();
  const picker=document.createElement('div');
  picker.className='shelf-picker';
  // Position near the element
  const rect=el.getBoundingClientRect();
  picker.style.position='fixed';
  picker.style.left=rect.left+'px';
  picker.style.top=(rect.bottom+4)+'px';
  // Checkboxes for existing shelves (sorted alpha)
  allSh.sort((a,b)=>a.localeCompare(b));
  let html='';
  allSh.forEach(sh=>{
    const checked=current.includes(sh)?'checked':'';
    html+='<label><input type="checkbox" value="'+esc(sh)+'" '+checked+'> <span class="sp-name">'+esc(sh)+'</span><span class="sp-del" onclick="event.preventDefault();event.stopPropagation();deleteShelf(this,\''+esc(sh).replace(/'/g,"\\'")+'\','+bookId+')" title="Delete shelf">&times;</span></label>';
  });
  // Add new shelf row
  html+='<div class="sp-add"><input type="text" placeholder="New shelf..." id="sp-new-input"><button onclick="addNewShelf('+bookId+')">Add</button></div>';
  html+='<button class="sp-done" onclick="commitShelfPicker('+bookId+')">Done</button>';
  picker.innerHTML=html;
  document.body.appendChild(picker);
  // Close on outside click
  setTimeout(()=>{
    function closeOnOutside(e){if(!picker.contains(e.target)){commitShelfPicker(bookId);document.removeEventListener('click',closeOnOutside)}}
    document.addEventListener('click',closeOnOutside);
  },100);
  // Enter key on new shelf input
  setTimeout(()=>{
    const inp=document.getElementById('sp-new-input');
    if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addNewShelf(bookId)}});
  },50);
}
function addNewShelf(bookId){
  const inp=document.getElementById('sp-new-input');
  if(!inp)return;
  const val=inp.value.trim();
  if(!val)return;
  // Add checkbox
  const picker=inp.closest('.shelf-picker');
  const label=document.createElement('label');
  label.innerHTML='<input type="checkbox" value="'+esc(val)+'" checked> '+esc(val);
  picker.insertBefore(label,picker.querySelector('.sp-add'));
  inp.value='';
  // Add to global list
  if(!ALL_SHELVES.includes(val)){ALL_SHELVES.push(val);ALL_SHELVES.sort();localStorage.setItem('bs_shelves',JSON.stringify(ALL_SHELVES))}
}
function deleteShelf(delBtn,shelfName,bookId){
  // Remove from global list
  ALL_SHELVES=ALL_SHELVES.filter(s=>s!==shelfName);
  localStorage.setItem('bs_shelves',JSON.stringify(ALL_SHELVES));
  // Remove from all books that have it
  DATA.forEach(b=>{
    const s=getShelves(b)||'';
    const parts=s.split(',').map(x=>x.trim()).filter(x=>x&&x!==shelfName);
    if(parts.join(', ')!==s)saveField(b.id,'shelves',parts.join(', '));
  });
  // Remove the label row from picker
  const label=delBtn.closest('label');
  if(label)label.remove();
}
function commitShelfPicker(bookId){
  const picker=document.querySelector('.shelf-picker');
  if(!picker)return;
  const checked=[...picker.querySelectorAll('input[type=checkbox]:checked')].map(c=>c.value);
  saveField(bookId,'shelves',checked.join(', '));
  picker.remove();
  renderTable();
  if(document.getElementById('modal').classList.contains('open')&&currentModalId===bookId)openModal(bookId);
}
function startEdit(el,bookId,field){
  if(el.classList.contains('editing'))return;
  el.classList.add('editing');
  const b=DATA.find(x=>x.id===bookId);
  if(field==='shelves'){openShelfPicker(el,bookId);return}
  let current;
  if(field==='date_read')current=fmtDate(getDateRead(b))||'';
  else if(field==='notes')current=getNotes(b)||'';
  else current=el.textContent;
  let input;
  if(field==='notes'){
    input=document.createElement('textarea');
    input.className='edit-input';input.rows=3;
    input.style.minHeight='60px';input.style.resize='vertical';
    input.value=current;input.placeholder='Add your notes...';
  } else if(field==='date_read'){
    // Date picker with text fallback
    input=document.createElement('input');
    input.type='date';input.className='edit-input';
    // Convert MM/DD/YYYY to YYYY-MM-DD for date input
    if(current){const p=current.split('/');if(p.length===3&&p[2].length===4)input.value=p[2]+'-'+p[0]+'-'+p[1]}
    input.title='Pick a date or type MM/DD/YYYY';
  } else {
    input=document.createElement('input');
    input.type='text';input.className='edit-input';
    input.value=current;
  }
  el.replaceWith(input);
  input.focus();
  if(input.type==='text')input.select();
  let committed=false;
  function commit(){
    if(committed)return;committed=true;
    let val=input.value.trim();
    if(field==='date_read'&&input.type==='date'&&val){
      // Convert YYYY-MM-DD to MM/DD/YYYY then to ISO
      const p=val.split('-');val=p[1]+'/'+p[2]+'/'+p[0];
      saveField(bookId,field,toISO(val));
    } else if(field==='date_read'){
      saveField(bookId,field,toISO(val));
    } else if(field==='notes'){
      saveField(bookId,field,val);
    } else {
      saveField(bookId,field,val);
    }
    renderTable();
    if(document.getElementById('modal').classList.contains('open')&&currentModalId===bookId)openModal(bookId);
  }
  input.addEventListener('blur',commit);
  input.addEventListener('keydown',e=>{
    if(field==='notes'&&e.key==='Enter'&&!e.shiftKey)return; // allow newlines in notes
    if(e.key==='Enter'){e.preventDefault();commit()}
    if(e.key==='Escape'){committed=true;renderTable()}
  });
  if(input.type==='date')input.addEventListener('change',commit);
}

function renderStats(){
  const total=DATA.length;
  const rated=DATA.filter(b=>getR(b)>0);
  const avgMy=rated.length?rated.reduce((s,b)=>s+getR(b),0)/rated.length:0;
  const pages=DATA.filter(b=>b.pages>0);
  const totalPages=pages.reduce((s,b)=>s+b.pages,0);
  const avgPages=pages.length?Math.round(totalPages/pages.length):0;
  const authors=new Set(DATA.map(b=>b.author)).size;
  const catCounts={};CATS.forEach(c=>{catCounts[c]=(BY_CAT[c]||[]).length});
  const maxCat=Math.max(...Object.values(catCounts),1);
  const authCount={};DATA.forEach(b=>{authCount[b.author]=(authCount[b.author]||0)+1});
  const topAuth=Object.entries(authCount).sort((a,b)=>b[1]-a[1]).slice(0,15);
  const maxAuth=topAuth[0]?topAuth[0][1]:1;
  const ratDist={};rated.forEach(b=>{const r=Math.floor(getR(b));ratDist[r]=(ratDist[r]||0)+1});
  const maxRat=Math.max(...Object.values(ratDist),1);
  const unrated=total-rated.length;
  const decCount={};DATA.forEach(b=>{if(b.year&&parseInt(b.year)>0){const d=Math.floor(parseInt(b.year)/10)*10;decCount[d]=(decCount[d]||0)+1}});
  const topDec=Object.entries(decCount).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxDec=topDec[0]?topDec[0][1]:1;

  let h='<div class="stats-grid">';
  h+='<div class="stat-card"><h3>Overview</h3><div class="mini-grid">';
  h+='<div><div class="big-num">'+total+'</div><div class="big-label">Books Read</div></div>';
  h+='<div><div class="big-num">'+CATS.length+'</div><div class="big-label">Categories</div></div>';
  h+='<div><div class="big-num">'+authors+'</div><div class="big-label">Authors</div></div>';
  h+='<div><div class="big-num">'+avgMy.toFixed(1)+'</div><div class="big-label">Avg Rating</div></div>';
  h+='<div><div class="big-num">'+totalPages.toLocaleString()+'</div><div class="big-label">Total Pages</div></div>';
  h+='<div><div class="big-num">'+avgPages+'</div><div class="big-label">Avg Pages</div></div>';
  h+='</div></div>';

  h+='<div class="stat-card"><h3>Books by Category</h3>';
  CATS.forEach(c=>{const n=catCounts[c]||0;h+='<div class="bar-row"><div class="bar-label">'+esc(c)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+n/maxCat*100+'%;background:'+(CC[c]||'#666')+'">'+n+'</div></div></div>'});
  h+='</div>';
  h+='<div class="stat-card"><h3>Most-Read Authors</h3>';
  topAuth.forEach(([a,n])=>{h+='<div class="bar-row"><div class="bar-label">'+esc(a)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+n/maxAuth*100+'%;background:var(--accent)">'+n+'</div></div></div>'});
  h+='</div>';
  h+='<div class="stat-card"><h3>Rating Distribution</h3>';
  for(let r=5;r>=1;r--){h+='<div class="bar-row"><div class="bar-label">'+'\u2605'.repeat(r)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(ratDist[r]||0)/maxRat*100+'%;background:var(--accent)">'+(ratDist[r]||0)+'</div></div></div>'}
  h+='<div class="bar-row"><div class="bar-label">Unrated</div><div class="bar-track"><div class="bar-fill" style="width:'+unrated/Math.max(maxRat,1)*100+'%;background:#555">'+unrated+'</div></div></div></div>';
  h+='<div class="stat-card"><h3>Publication Decade</h3>';
  topDec.forEach(([d,n])=>{h+='<div class="bar-row"><div class="bar-label">'+d+'s</div><div class="bar-track"><div class="bar-fill" style="width:'+n/maxDec*100+'%;background:var(--accent)">'+n+'</div></div></div>'});
  h+='</div></div>';
  document.getElementById('v-stats').innerHTML=h;
}

// ===== TAB / FILTER / SORT =====
function switchTab(id){
  document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.toggle('active',b.textContent.trim().toLowerCase()===id)});
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el=document.getElementById('v-'+id);if(el)el.classList.add('active');
  applyFilters();
}
function applyFilters(){
  const q=document.getElementById('srch').value.toLowerCase();
  const c=document.getElementById('cf').value;
  let n=0;
  document.querySelectorAll('.book3d,.cover-item').forEach(e=>{
    const t=(e.dataset.t||'').toLowerCase(),a=(e.dataset.a||'').toLowerCase(),ec=e.dataset.c||'';
    const v=(!q||t.includes(q)||a.includes(q))&&(!c||ec===c);
    e.style.display=v?'':'none';if(v)n++});
  document.querySelectorAll('#bktbl tbody tr').forEach(r=>{
    const t=(r.dataset.t||'').toLowerCase(),a=(r.dataset.a||'').toLowerCase(),rc=r.dataset.c||'';
    const v=(!q||t.includes(q)||a.includes(q))&&(!c||rc===c);
    r.style.display=v?'':'none'});
  document.querySelectorAll('.cs').forEach(s=>{
    const vis=s.querySelectorAll('.book3d:not([style*="display: none"]),.cover-item:not([style*="display: none"])');
    s.style.display=vis.length>0?'':'none'});
  const active=document.querySelector('.view.active');
  if(active){
    if(active.id==='v-spine')n=active.querySelectorAll('.book3d:not([style*="display: none"])').length;
    else if(active.id==='v-cover')n=active.querySelectorAll('.cover-item:not([style*="display: none"])').length;
    else if(active.id==='v-table')n=document.querySelectorAll('#bktbl tbody tr:not([style*="display: none"])').length;
    else n=DATA.length;
  }
  document.getElementById('st').textContent=n+' books';
}
document.getElementById('srch').addEventListener('input',applyFilters);
document.getElementById('cf').addEventListener('change',applyFilters);

let sortCol=-1,sortAsc=true;
function sortTbl(th){
  const col=parseInt(th.dataset.col);const type=th.dataset.type;
  const tbl=document.getElementById('bktbl');if(!tbl)return;
  const tbody=tbl.querySelector('tbody');
  const rows=[...tbody.querySelectorAll('tr')];
  if(sortCol===col)sortAsc=!sortAsc;else{sortCol=col;sortAsc=true}
  document.querySelectorAll('.bk-tbl th').forEach(h=>h.classList.remove('sorted'));
  th.classList.add('sorted');
  const arrow=th.querySelector('.arrow');if(arrow)arrow.textContent=sortAsc?'\u25B2':'\u25BC';
  rows.sort((a,b)=>{
    let av,bv;const ac=a.children[col],bc=b.children[col];
    if(type==='num'){av=parseFloat(ac?.dataset?.v||ac?.textContent)||0;bv=parseFloat(bc?.dataset?.v||bc?.textContent)||0}
    else{av=(ac?.textContent||'').toLowerCase();bv=(bc?.textContent||'').toLowerCase()}
    if(av<bv)return sortAsc?-1:1;if(av>bv)return sortAsc?1:-1;return 0;
  });
  rows.forEach(r=>tbody.appendChild(r));
}

// ===== INIT =====
fetch('data.json').then(r=>r.json()).then(d=>{
  DATA=d.books;
  DATA.forEach(b=>{if(!BY_CAT[b.category])BY_CAT[b.category]=[];BY_CAT[b.category].push(b)});
  CATS=Object.keys(BY_CAT).sort();
  const sel=document.getElementById('cf');
  CATS.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c+' ('+BY_CAT[c].length+')';sel.appendChild(o)});
  document.getElementById('bookcount').textContent=DATA.length;
  document.getElementById('catcount').textContent=CATS.length;
  collectAllShelves();
  renderSpine();renderCover();renderTable();renderStats();
}).catch(e=>{document.getElementById('v-spine').innerHTML='<p style="color:red">Failed to load data: '+e.message+'</p>';console.error(e)});

// Register service worker for offline PWA
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(e=>console.log('SW reg failed:',e))}
